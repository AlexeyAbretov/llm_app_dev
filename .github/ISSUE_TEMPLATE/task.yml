name: Задача пайплайна
description: Баг или фича с приоритетом и версией (milestone)
title: ""
labels: ["needs-plan"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Тип
      options:
        - feature
        - bug
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      options:
        - p0
        - p1
        - p2
        - p3
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Цель
      description: Что должно появиться или что сломано.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Критерий готовности
    validations:
      required: true
  - type: input
    id: mvp_stage
    attributes:
      label: Этап MVP каталога (если задача про продукт)
      placeholder: "например stage/7 или пусто"
  - type: markdown
    attributes:
      value: |
        Milestone (версия + дата релиза) выставь в правой панели issue.
        Labels `feature`/`bug` и `p0`–`p3` поставь вручную, пока оркестратор не создан.
        Контракт: docs/AGENT_PIPELINE.md
