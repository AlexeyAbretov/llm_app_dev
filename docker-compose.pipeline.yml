services:
  orchestrator:
    build:
      context: ./pipeline
    env_file:
      - path: pipeline/.env
        required: true
    environment:
      PORT: "3020"
      DATA_DIR: /data
      PROMPTS_DIR: /app/prompts
    ports:
      - "127.0.0.1:3020:3020"
    volumes:
      - pipeline_data:/data
    user: "0"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

volumes:
  pipeline_data:
