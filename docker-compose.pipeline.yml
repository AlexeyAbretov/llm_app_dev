services:
  orchestrator:
    build:
      context: ./pipeline
    env_file:
      - path: pipeline/.env
        required: false
    environment:
      PORT: "3020"
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-30000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_REPO_URL: ${CURSOR_REPO_URL:-}
      CURSOR_STARTING_REF: ${CURSOR_STARTING_REF:-main}
      CURSOR_MODEL: ${CURSOR_MODEL:-composer-2.5}
      DATA_DIR: /data
      PROMPTS_DIR: /app/prompts
    ports:
      - "127.0.0.1:3020:3020"
    volumes:
      - pipeline_data:/data
    user: "0"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

volumes:
  pipeline_data:
